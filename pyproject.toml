[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graph-db-metrics"
version = "0.1.0"
description = "Measure Neo4j property graphs and generate validated synthetic counterparts"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=6.0,<7",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "duckdb>=1.4,<2",
  "pandas>=2.2,<4", # Avoid repeated optional-module probes in DuckDB's batch conversion.
  "igraph>=0.11,<2",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "faker>=37,<50",
]

[project.scripts]
graph-metrics = "graph_metrics.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_metrics"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
markers = ["integration: requires Docker", "scale: opt-in million-node benchmark"]
